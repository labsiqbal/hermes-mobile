const VARIANT='shell';
function displayTitle(){return state.route==='home'?'Hermes':state.route==='chats'?'Chats':title(state.route);}
function headerLeading(){return ['home','chats','bots','activity','manage'].includes(state.route)?`<span class="brand-mark">${icon('capability')}</span>`:`<button class="icon-button" data-action="back" data-qa="back" aria-label="Back">${icon('back')}</button>`;}
function rootScreen(){return `<div class="hero"><div class="eyebrow">Your personal relay</div><h2>Your work,<br>within reach.</h2><p>A quiet window into your devices.</p></div>${heading('Your devices','gateways','Manage')}<section class="device" aria-label="Active device"><div class="device-heading">${icon('device')}<div class="copy"><strong>${esc(state.gateway)}</strong><small>${esc(state.profile)} · Field notes</small></div><span class="badge ${canMutate()?'green':'amber'}">${canMutate()?'Ready':state.mode}</span></div>${state.mode==='empty'?empty('recent work'):link('chat',`<span class="copy"><small>Continue where you left off</small><strong>Launch brief</strong><small>Two decisions before Monday</small></span>${icon('chevron')}`,'row','resume')}</section><section class="device device-off"><button data-action="failed-switch"><span class="device-heading">${icon('device')}<span class="copy"><strong>Field laptop</strong><small>Offline · last sample seen yesterday</small></span>${icon('chevron')}</span></button></section>${heading('Needs your attention')}${row('approval',approvalState()==='pending'?'One decision, before it runs':'Launch checks · '+approvalState(),'Field notes · '+esc(state.profile)+' · simulation','shield')}${heading('On your rhythm','schedules','Schedules')}${row('schedule','Morning brief','Weekdays at 08:30 · Asia/Jakarta','clock')}<p class="meta" style="margin-top:24px">Open a conversation to find its files, Git review and workspace tools.</p>`;}
function bottomNavigation(){if(!['home','chats','bots','activity','manage'].includes(state.route))return '';return `<nav class="tabs" aria-label="Primary" data-bottom-nav>${[['home','Home'],['chats','Chats'],['bots','Bots'],['activity','Activity'],['manage','Manage']].map(([r,t])=>`<a class="tab" href="#${r}" ${state.route===r?'aria-current="page"':''}>${icon(r==='chats'?'chat':r==='bots'?'bot':r)}<span>${t}</span></a>`).join('')}</nav>`;}
function architectureClass(){return ['home','chats','bots','activity','manage'].includes(state.route)?'has-tabs':'';}

const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.file}</svg>`;
const esc=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(q)=>document.querySelector(q);
const state={route:'home',gateway:'Atlas',profile:'studio',mode:'connected',session:'field-notes',drafts:{},scrolls:{},messages:{},approvals:{},schedulePaused:{},capabilityEnabled:{},memoryNotes:{},tasksDone:{},models:{},botFilter:'all',paletteQuery:''};
let lastFocus=null, sheetKind='', historyDepth=0, toastTimer;
const parents={home:'gateways',chats:'home',chat:'chats',bots:'home',bot:'bots',groups:'bots',group:'groups',activity:'home',approval:'activity',schedules:'activity',schedule:'schedules',manage:'home',gateways:'manage',profiles:'manage',capabilities:'manage',memory:'profiles',messaging:'manage',webhooks:'manage',kanban:'manage','command-center':'manage',files:'chat',preview:'files',artifacts:'files',git:'chat',terminal:'chat',browser:'chat',settings:'manage',voice:'settings',native:'manage'};
const scopeKey=()=>`${state.gateway}/${state.profile}`;
const chatKey=()=>`${scopeKey()}/${state.session}`;
const sessionModel=()=>state.models[chatKey()]||'Sonnet · balanced';
// Separate fictional Mira records, not cross-profile backend routing.
const BOT_FIXTURES={
 'Atlas/studio':{gateway:'Atlas',profile:'studio',session:'mira'},
 'Atlas/research':{gateway:'Atlas',profile:'research',session:'mira'},
 'Harbor/studio':{gateway:'Harbor',profile:'studio',session:'mira'},
 'Harbor/research':{gateway:'Harbor',profile:'research',session:'mira'}
};
const botFixture=()=>BOT_FIXTURES[scopeKey()];
const contextIdentity=()=>({gateway:state.gateway,profile:state.profile,session:state.session});
const historyEntry=()=>({prototype:true,depth:historyDepth,context:contextIdentity()});
const canMutate=()=>state.mode==='connected';
const mutationDisabled=()=>canMutate()?'':'disabled';
const title=(route)=>ROUTES.find(r=>r.id===route)?.title||'Home';
const approvalState=()=>state.approvals[scopeKey()]||'pending';
const scope=()=>`<div class="scope">Gateway <strong>${esc(state.gateway)}</strong> &nbsp; / &nbsp; Profile <strong>${esc(state.profile)}</strong><br>Applies to this sample context only.</div>`;
const link=(route,label,cls='',qa='')=>`<a href="#${route}" data-route="${route}" ${qa?`data-qa="${qa}"`:''} class="${cls}">${label}</a>`;
function row(route,label,description='',glyph='file',extra=''){return link(route,`<span class="glyph">${icon(glyph)}</span><span class="copy"><strong>${label}</strong>${description?`<small>${description}</small>`:''}</span>${icon('chevron')}`,'row',extra);}
const heading=(label,route,action='View all')=>`<div class="section-head"><h3>${label}</h3>${route?link(route,action+icon('chevron'),'text-link'):''}</div>`;
const button=(action,label,cls='',attrs='')=>`<button class="button ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
const values=(items)=>`<dl class="key-values">${items.map(([k,v])=>`<div class="kv"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const stateSelect=()=>`<select aria-label="Prototype state" data-action="state-select" data-qa="state-select" style="width:116px;min-height:44px;padding:8px;font-size:13px">${['connected','offline','empty','error'].map(s=>`<option value="${s}" ${state.mode===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select>`;
function stateNote(){return state.mode==='offline'?'<div class="state-note" role="status">Offline preview · saved sample only. Mutations are disabled; your draft stays here.</div>':state.mode==='error'?'<div class="state-note" role="status">Connection error preview · sample session expired. Nothing was submitted. Use the state selector to return to Connected.</div>':state.mode==='empty'?'<div class="state-note" role="status">Empty preview · no remote data. Existing local drafts stay on this device.</div>':'';}
function empty(kind){return `<div class="empty-state">${icon('folder')}<h2>No ${kind} yet</h2><p>This is the empty fixture, not a live gateway response. Explore the tools, or restore the sample.</p>${button('restore','Restore connected sample','')}</div>`;}
function saveView(){const composer=$('[data-qa="composer"]');if(composer)state.drafts[chatKey()]=composer.value;const body=$('main');if(body)state.scrolls[state.route==='chat'?chatKey():`${scopeKey()}/${state.route}`]=body.scrollTop;}
function navigate(route,{replace=false,context={}}={}){
 if(!ROUTES.some(r=>r.id===route)){notify('Unknown prototype route. Opening Home.');route='home';}
 if(route===state.route&&location.hash==='#'+route&&Object.entries(context).every(([key,value])=>state[key]===value)){closeSheet();return;}
 saveView();closeSheet();Object.assign(state,context);state.route=route;
 if(!replace)historyDepth++;
 history[replace?'replaceState':'pushState'](historyEntry(),'',`#${route}`);render();
}
function back(){saveView();if(historyDepth>0){history.back();return;}navigate(parents[state.route]||'home',{replace:true});}
window.addEventListener('popstate',()=>{
 saveView();closeSheet();historyDepth=history.state?.depth||0;
 if(history.state?.prototype&&history.state.context)Object.assign(state,history.state.context);
 state.route=ROUTES.some(r=>r.id===location.hash.slice(1))?location.hash.slice(1):'home';
 history.replaceState(historyEntry(),'',`#${state.route}`);render();
});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next===state.route)return;saveView();closeSheet();state.route=ROUTES.some(r=>r.id===next)?next:'home';render();});
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;toastTimer=setTimeout(()=>{if($('#toast'))$('#toast').textContent='';},3600);}
function resizeComposer(){const el=$('[data-qa="composer"]');if(!el)return;el.style.height='auto';el.style.height=Math.min(el.scrollHeight,130)+'px';$('[data-qa="send"]').disabled=!canMutate()||!el.value.trim();}
function contextButton(){return `<button class="context" data-action="context" data-qa="context-switcher" aria-label="Switch gateway and profile: ${esc(state.gateway)} / ${esc(state.profile)}" aria-haspopup="dialog"><span class="dot ${canMutate()?'':'off'}"></span><span class="label">${esc(state.gateway)} <span aria-hidden="true">/</span> ${esc(state.profile)} · ${state.mode==='connected'?'sample connected':state.mode}</span>${icon('down')}</button>`;}
function header(){return `<header class="header"><div class="title-row">${headerLeading()}<h1 tabindex="-1">${state.route==='chat'?(state.session==='mira'?'Mira':'Field notes'):displayTitle()}</h1><button class="icon-button" data-action="palette" aria-label="Open command palette" data-qa="command-palette" aria-haspopup="dialog">${icon('command')}</button></div>${contextButton()}</header>`;}
function composer(){return `<footer class="composer"><nav class="composer-tools" aria-label="Conversation tools">${link('files',icon('folder')+'Files','','open-files')}${link('git',icon('git')+'Git','','open-git')}<button data-action="tools" aria-haspopup="dialog">${icon('plus')}Tools</button></nav><div class="input-pill"><textarea rows="1" aria-label="Message draft" placeholder="Continue the conversation…" data-qa="composer">${esc(state.drafts[chatKey()]||'')}</textarea><button class="send" data-action="send" data-qa="send" aria-label="Send simulated message" ${mutationDisabled()}>${icon('send')}</button></div><div class="model-line"><button data-action="model" aria-haspopup="dialog" aria-label="Model settings">${esc(sessionModel())}${icon('down')}</button>${stateSelect()}</div></footer>`;}
function chatScreen(){if(state.mode==='empty')return empty('messages');return `<div class="meta">${state.session==='mira'?esc(`${botFixture().gateway} / ${botFixture().profile} / ${botFixture().session}`):'Field notes'} · sample conversation · 14:32</div><div class="user-message">Review the launch brief. What still needs a decision before Monday?</div><article class="assistant"><div class="byline">${icon('capability')} ${state.session==='mira'?'Mira · research partner':'Hermes · '+esc(state.profile)}</div><p>The brief is in good shape. I’d resolve two things before it goes to the team:</p><ul><li><strong>Start with a small pilot.</strong> Invite the first twelve teams, then widen access after the feedback review.</li><li><strong>Make the owner explicit.</strong> Jules can own onboarding; Rowan can cover support during the first week.</li></ul><p>I’ve outlined the decisions in the launch brief. The copy change is ready for your review, but nothing has been published.</p>${link('preview',icon('file')+'<span>Launch brief.md<small class="meta" style="display:block">Sample artifact · 2.4 KB</small></span>'+icon('chevron'),'inline-file','open-preview')}<div class="tool-log">${icon('check')}Read 3 sample files · no tools executed</div>${link('approval',icon('shield')+'<span>'+ (approvalState()==='pending'?'Review a simulated approval':'Approval '+approvalState())+'</span>'+icon('chevron'),'inline-file')}</article>${(state.messages[chatKey()]||[]).map(m=>`<div class="user-message">${esc(m)}</div><article class="assistant"><div class="byline">${icon('capability')}Prototype reply</div><p>Your message is stored for this preview only. No model, gateway, or shell was contacted.</p></article>`).join('')}`;}
function chatsScreen(){return `<div class="hero"><div class="eyebrow">${esc(state.gateway)} / ${esc(state.profile)}</div><h2>Pick up a thought.</h2><p>Your conversations, grouped by project.</p></div>${state.mode==='empty'?empty('conversations'):`${heading('Field notes')}${row('chat','Launch brief','Two decisions before Monday · 14:32','chat','resume')}${row('chat','Pilot feedback','Research synthesis · Yesterday','chat')}${heading('Recent')}${row('chat','A quieter morning routine','Personal workspace · Thursday','chat')}`}<p class="meta">Sample sessions open the same review thread in this prototype.</p>${row('bots','Talk to a bot','Mira, Cedar and your team rooms','bot')}`;}
function botsScreen(){return `<div class="hero"><div class="eyebrow">Your collaborators</div><h2>The right mind<br>for the next step.</h2></div><div class="segmented" aria-label="Roster type"><button data-action="filter-bots" data-value="all" aria-pressed="${state.botFilter==='all'}">Bots</button><a href="#groups" class="button">Groups</a></div>${state.mode==='empty'?empty('bots'):`<a class="row" href="#bot"><span class="avatar">M</span><span class="copy"><strong>Mira</strong><small>Research partner · ${esc(botFixture().profile)} profile</small></span>${icon('chevron')}</a><button class="row" data-action="bot-chat" data-qa="bot-chat"><span class="glyph">${icon('chat')}</span><span class="copy"><strong>Chat with Mira</strong><small>Open her existing conversation</small></span>${icon('chevron')}</button><a class="row" href="#bot"><span class="avatar cool">C</span><span class="copy"><strong>Cedar</strong><small>Code reviewer · sample roster entry</small></span>${icon('chevron')}</a>`}${heading('Together')}${row('group','Launch room','Mira + Cedar · paused, not running','group')}${row('schedules','Bot routines','See cadence and delivery context','clock')}`;}

function nativeScreen(){return `<div class="detail-title"><div class="eyebrow">Platform boundaries</div><h2>Some things need<br>more than a browser.</h2><p>These destinations remain visible. They are not claimed as working parity.</p></div><div data-native-warning class="callout"><strong>Prototype · not connected / blocked</strong><p>No native bridge, SSH, OS permission, process, or service is used.</p></div>${[['terminal','Terminal & persistent shells','Desktop PTY / SSH capability; a shell transport and security boundary still need verification.'],['browser','Browser & annotation','Desktop browser host; element capture, redaction and annotation need a proven mobile equivalent.'],['voice','Voice capture & playback','Permissions, formats and playback policy need device tests. No recording occurs.']].map(([r,t,d])=>row(r,t,d,r==='browser'?'web':r==='voice'?'voice':'terminal')).join('')}<div class="native-item"><h3>${icon('lock')}SSH & Cloud lifecycle</h3><p>Source family: Desktop multi-connection host. Key handling, tunnels and lifecycle are blocked; no connection attempted.</p></div><div class="native-item"><h3>${icon('device')}HUD & global Quick Entry</h3><p>Source family: Desktop Electron windows / OS shortcuts. Always-on-top, screen context and global hotkeys are native-only proposals.</p></div><div class="native-item"><h3>${icon('shield')}Keychain, updates & uninstall</h3><p>Source family: Desktop OS integration. Secure storage, keep-awake, notifications, installer and backend maintenance are not implemented.</p></div>`;}

function settingsScreen(){return `<div class="detail-title"><div class="eyebrow">Preferences / boundaries</div><h2>Comfort without<br>losing control.</h2></div>${scope()}${heading('Conversation')}<button class="row" data-action="model"><span class="glyph">${icon('capability')}</span><span class="copy"><strong>Session model</strong><small>${esc(sessionModel())} · local sample choice</small></span>${icon('chevron')}</button>${row('voice','Voice','Permissions not requested','voice')}<details open><summary>Safety & approvals</summary><p>Always ask before publishing or destructive actions. Dangerous auto-approval is not offered in this prototype.</p></details>${heading('This interface')}<details><summary>Appearance & accessibility</summary><p>System font, restrained dark theme, reduced motion, visible keyboard focus and 44px touch targets. Theme, accent, pets, font and language controls require later implementation. This prototype is English-only.</p></details><details><summary>Accounts, providers & billing</summary><p>No credentials or billing data exist here. Provider setup and local-model installation are not connected.</p></details>${row('native','Notifications & lifecycle','No background guarantees or OS actions','lock')}`;}
const screens={chat:chatScreen,chats:chatsScreen,bots:botsScreen,bot:botScreen,activity:activityScreen,approval:approvalScreen,schedules:schedulesScreen,schedule:scheduleScreen,manage:manageScreen,gateways:gatewaysScreen,profiles:profilesScreen,capabilities:capabilitiesScreen,memory:memoryScreen,messaging:messagingScreen,webhooks:webhooksScreen,kanban:kanbanScreen,'command-center':commandCenterScreen,files:filesScreen,preview:previewScreen,artifacts:artifactsScreen,git:gitScreen,group:groupScreen,groups:()=>`<div class="hero"><div class="eyebrow">Shared conversations</div><h2>Bring your team<br>into the room.</h2><p>Groups are separate from individual bot chats.</p></div>${state.mode==='empty'?empty('groups'):row('group','Launch room','Mira + Cedar · paused sample','group')}<div class="callout"><p>Background agent execution is not provided by this prototype.</p></div>`,native:nativeScreen,terminal:()=>blockedScreen('terminal'),browser:()=>blockedScreen('browser'),voice:()=>blockedScreen('voice'),settings:settingsScreen};

function render(){
 document.title=`${displayTitle()} · Hermes ${VARIANT==='shell'?'A / Shell':'B / Workspace'} prototype`;
 $('#app').className=architectureClass()+(state.route==='chat'?' in-chat':'');
 $('#app').innerHTML=`${state.route==='chat'?'':`<div class="prototype-bar"><span>PROTOTYPE <span class="long-label">· ${VARIANT==='shell'?'A / Shell':'B / Workspace'} · local only</span></span>${stateSelect()}</div>`}${header()}<main id="content" class="body ${state.route==='chat'?'chat-body':''}" ${state.route==='chat'?'data-qa="transcript"':''}>${stateNote()}${state.route==='home'?rootScreen():screens[state.route]()}</main>${state.route==='chat'?composer():bottomNavigation()}<div id="toast" class="toast" role="status" aria-live="polite"></div>`;
 resizeComposer();
 const body=$('main'),key=state.route==='chat'?chatKey():`${scopeKey()}/${state.route}`;
 body.scrollTop=state.scrolls[key]??(state.route==='chat'?body.scrollHeight:0);
 $('h1').focus({preventScroll:true});

function closeSheet(){const d=$('#sheet');if(!d.open)return;d.close();sheetKind='';if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
function openSheet(kind){saveView();lastFocus=document.activeElement;sheetKind=kind;let heading='';let content='';
 if(kind==='context'){heading='Choose your context';content=`<p>Choose a sample gateway and profile together. A failed switch keeps your current workspace and draft.</p><div class="scope">Current: ${esc(state.gateway)} / ${esc(state.profile)}</div><div id="sheet-message" class="sheet-message" role="status"></div><button class="row" data-action="choose-atlas" data-qa="context-atlas"><span class="glyph">${icon('device')}</span><span class="copy"><strong>Atlas / studio</strong><small>Sample connected · Field notes</small></span>${icon('chevron')}</button><button class="row" data-action="choose-harbor" data-qa="context-harbor"><span class="glyph">${icon('device')}</span><span class="copy"><strong>Harbor / research</strong><small>Sample connected · separate local draft</small></span>${icon('chevron')}</button><button class="row" data-action="failed-switch" data-qa="context-failed"><span class="glyph">${icon('device')}</span><span class="copy"><strong>Field laptop / studio</strong><small>Unavailable · try a failed switch</small></span>${icon('chevron')}</button>${row('profiles','Profiles on this gateway','Change identity without changing devices','group')}<label class="form-field"><span>Preview state · no network requests</span>${stateSelect()}</label>`;}
 else if(kind==='palette'){heading='Go anywhere';content=`<p>Find a destination or browse capabilities. All results are prototype screens.</p><input type="search" class="palette-search" aria-label="Find a destination" placeholder="Try files, memory, schedules…" data-action="palette-search" autofocus><div class="palette-list" id="palette-list">${paletteResults('')}</div>`;}
 else if(kind==='tools'){heading='Conversation tools';content=`<p>Inspect the workspace without losing your draft.</p>${row('files','Files','Browse the sample workspace','folder','open-files')}${row('git','Git review','Read the sample change','git','open-git')}${row('artifacts','Artifacts','Output linked to this conversation','board')}${row('terminal','Terminal','Not connected · no shell execution','terminal')}${row('browser','Browser & annotation','Blocked · native boundary','web')}${row('voice','Voice','Not connected · no recording','voice')}${button('attach-sample','Add sample file reference','wide',mutationDisabled())}`;}
 else if(kind==='approve'||kind==='deny'){const approving=kind==='approve';heading=approving?'Confirm simulated approval':'Confirm simulated denial';content=`${scope()}<p>Session <strong>Launch brief</strong> · request appr-demo-014</p><pre class="command">npm run check:launch</pre><div class="callout"><strong>Simulation only · no execution</strong><p>${approving?'Approve':'Deny'} changes local mock state only. Nothing is sent to ${esc(state.gateway)} and no shell runs.</p></div><div class="actions">${button('close','Cancel')}${button(approving?'confirm-approval':'confirm-denial',approving?'Approve in prototype':'Deny in prototype',approving?'primary':'danger',`data-qa="${approving?'confirm-approval':'confirm-denial'}" ${mutationDisabled()}`)}</div>`;}
 else if(kind==='model'){heading='Session model';content=`<p>Local choice for this prototype only. Does not configure a provider, model or reasoning budget.</p>${['Sonnet · balanced','GPT · thorough','Local · quick'].map(m=>`<button class="row" data-action="choose-model" data-value="${m}" aria-pressed="${sessionModel()===m}" ${mutationDisabled()}><span class="copy"><strong>${m}</strong><small>Sample preset · not a model call</small></span>${sessionModel()===m?icon('check'):icon('chevron')}</button>`).join('')}`;}
 else if(kind==='git-boundary'){heading='Read first. Act deliberately.';content=`${scope()}<p>A real Git action must name its repository, branch and remote effect. This prototype implements read-only diff review, not stage/commit/push/revert or worktree changes.</p><pre>/sample/field-notes\ndraft/pilot-launch\nRemote: not connected</pre>${button('close','Back to review','wide')}`;}
 else if(kind==='webhook-preview'){heading='Sample event inspection';content=`<span class="badge">Not delivered</span><p><strong>feedback.created</strong> would add a note to Field notes / intake. It does not change approval policy.</p>${values([['Validation','Illustrative only'],['Authentication','Not configured'],['Remote requests','None']])}${button('close','Close inspection','wide')}`;}
 const d=$('#sheet');d.innerHTML=`<div class="sheet-top"><h2 id="sheet-title">${heading}</h2><button class="icon-button" data-action="close" aria-label="Close sheet">${icon('close')}</button></div><div class="sheet-content">${content}</div>`;if(!d.open)d.showModal();(d.querySelector('[autofocus]')||d.querySelector('button,input,select,a')).focus();
}
function paletteResults(query){const found=ROUTES.filter(r=>(r.title+' '+r.id+' '+r.kind).toLowerCase().includes(query.toLowerCase()));return found.length?found.map(r=>row(r.id,r.title,r.kind==='blocked'?'Prototype · native boundary / blocked':'Prototype destination · '+r.id,r.kind==='blocked'?'lock':'chevron')).join(''):'<p>No destinations found. Try “files” or “capabilities”.</p>';}
function switchContext(gateway,profile){saveView();closeSheet();state.gateway=gateway;state.profile=profile;state.session='field-notes';history.replaceState(historyEntry(),'',`#${state.route}`);render();if(VARIANT==='workspace'&&state.route==='gateways')navigate('home');notify(`Sample context: ${gateway} / ${profile}. No connection attempted.`);}
function send(){const el=$('[data-qa="composer"]');if(!el||!canMutate()||!el.value.trim())return;saveView();(state.messages[chatKey()]??=[]).push(el.value);state.drafts[chatKey()]='';delete state.scrolls[chatKey()];render();$('[data-qa="composer"]').focus();}
const mutations=new Set(['send','approve','deny','confirm-approval','confirm-denial','toggle-schedule','toggle-capability','save-memory','complete-task','attach-sample','add-reference','choose-model']);
document.addEventListener('click',event=>{
 const a=event.target.closest('a[href^="#"]');if(a){event.preventDefault();const route=a.getAttribute('href').slice(1);navigate(route,{context:a.dataset.qa==='resume'?{session:'field-notes'}:{}});return;}
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
 if(mutations.has(action)&&!canMutate()){notify('Unavailable in this preview state. Draft preserved.');return;}
 if(['context','palette','tools','approve','deny','model','git-boundary','webhook-preview'].includes(action)){openSheet(action);return;}
 if(action==='close'){closeSheet();return;}
 if(action==='back'){back();return;}
 if(action==='send'){send();return;}
 if(action==='bot-chat'){navigate('chat',{context:botFixture()});return;}
 if(action==='failed-switch'){const message='Could not switch to Field laptop. '+state.gateway+' / '+state.profile+' remains active. Your draft is unchanged.';if($('#sheet-message'))$('#sheet-message').textContent=message;else notify(message);return;}
 if(action==='choose-atlas'){switchContext('Atlas','studio');return;}
 if(action==='choose-harbor'){switchContext('Harbor','research');return;}
 if(action==='choose-studio'||action==='choose-research'){switchContext(state.gateway,action==='choose-studio'?'studio':'research');return;}
 if(action==='confirm-approval'||action==='confirm-denial'){if(approvalState()!=='pending'){closeSheet();return;}state.approvals[scopeKey()]=action==='confirm-approval'?'approved':'denied';closeSheet();render();return;}
 if(action==='restore'){saveView();state.mode='connected';closeSheet();render();return;}
 if(action==='toggle-schedule'){state.schedulePaused[scopeKey()]=!state.schedulePaused[scopeKey()];render();notify('Sample schedule updated locally. No scheduler contacted.');return;}
 if(action==='toggle-capability'){state.capabilityEnabled[scopeKey()]=state.capabilityEnabled[scopeKey()]===false;render();notify('Local catalogue updated. No tools enabled remotely.');return;}
 if(action==='save-memory'){state.memoryNotes[scopeKey()]=$('#memory-note').value;notify('Sample note saved locally for '+state.profile+'.');return;}
 if(action==='complete-task'){state.tasksDone[scopeKey()]=true;render();notify('Task moved to Done locally.');return;}
 if(action==='add-reference'||action==='attach-sample'){const draft=state.drafts[chatKey()]||'';state.drafts[chatKey()]=draft+(draft?'\n':'')+'@sample/field-notes/Launch brief.md';closeSheet();if(state.route==='chat')render();notify('Sample reference added to your draft. Nothing uploaded or sent.');return;}
 if(action==='choose-model'){state.models[chatKey()]=el.dataset.value;closeSheet();render();return;}
 if(action==='filter-bots'){state.botFilter='all';render();}
});
document.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-qa="composer"]')){state.drafts[chatKey()]=el.value;resizeComposer();}if(el.dataset.action==='palette-search')$('#palette-list').innerHTML=paletteResults(el.value);if(el.dataset.action==='capability-search'){let count=0;document.querySelectorAll('[data-capability]').forEach(item=>{item.hidden=!item.dataset.capability.toLowerCase().includes(el.value.toLowerCase());if(!item.hidden)count++;});$('#capability-empty').hidden=count>0;}});
document.addEventListener('change',event=>{if(event.target.dataset.action==='state-select'){saveView();state.mode=event.target.value;closeSheet();render();}});
document.addEventListener('keydown',event=>{
 if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();openSheet('palette');return;}
 if(event.target.matches('[data-qa="composer"]')&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send();return;}
 const d=$('#sheet');if(d.open&&event.key==='Tab'){const focusables=[...d.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(el=>el.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
$('#sheet').addEventListener('cancel',event=>{event.preventDefault();closeSheet();});
$('#sheet').addEventListener('click',event=>{if(event.target===$('#sheet')){const r=event.target.getBoundingClientRect();if(event.clientY<r.top||event.clientX<r.left||event.clientX>r.right)closeSheet();}});
window.__prototype={navigate,getState:()=>JSON.parse(JSON.stringify({...state,approval:approvalState(),draft:state.drafts[chatKey()]||''}))};
state.route=ROUTES.some(r=>r.id===location.hash.slice(1))?location.hash.slice(1):'home';
history.replaceState(historyEntry(),'',`#${state.route}`);render();
</script></body></html>
