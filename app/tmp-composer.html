<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="dist/assets/index-C_QHYJFA.css">
<style>
  html,body{margin:0;background:#101012}
  .fake-chat{display:flex;flex-direction:column;min-height:844px;background:var(--chrome)}
  .spacer{flex:1}
</style>
</head><body>
<div class="chat-view fake-chat">
  <div class="spacer"></div>
  <!-- state A: empty composer -->
  <div class="composer-wrap">
    <div class="composer-pill">
      <textarea class="composer-input" rows="1" placeholder="Message…" style="height:24px"></textarea>
      <button class="composer-action composer-send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div style="height:40px"></div>
  <!-- state B: multiline input, ready to send -->
  <div class="composer-wrap">
    <div class="composer-pill">
      <textarea class="composer-input" rows="1" style="height:90px">bro gw mau lanjutin project ini
tolong refactor composer biar multiline
dan session bisa dipilih dari board</textarea>
      <button class="composer-action composer-send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>
<div id="metrics" style="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;font:11px monospace;padding:6px;white-space:pre;z-index:99"></div>
<script>
// Apply the same auto-grow logic the app uses (height:auto → min(scrollHeight,132)).
for(const ta of document.querySelectorAll('.composer-input')){
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,132)+'px';
}
requestAnimationFrame(()=>{
  const pills=document.querySelectorAll('.composer-pill');
  const input=pills[0].querySelector('.composer-input');
  const cs=getComputedStyle, p=cs(input), w=cs(pills[0]);
  const btn=cs(pills[0].querySelector('.composer-action'));
  document.getElementById('metrics').textContent=[
    'pill: bg='+w.backgroundColor+' r='+w.borderRadius+' pad='+w.padding,
    'input: font='+p.fontSize+' lh='+p.lineHeight+' pad='+p.padding+' h='+input.style.height,
    'btn: '+btn.width+'x'+btn.height+' bg='+btn.backgroundColor+' r='+btn.borderRadius,
    'btnB: '+getComputedStyle(pills[1].querySelector('.composer-action')).backgroundColor,
  ].join('\n');
});
</script>
</body></html>
